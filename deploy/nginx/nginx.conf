events {}

http {
  upstream web { server web:3000; }
  upstream api { server api:3001; }

  server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 challenge
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }


    client_max_body_size 512m;

    # Website next.js (landing + SPA + server-rendered pages)
    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Website API (also used directly by desktop app / device login)
    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket sync transport (desktop <-> mobile)
    location /ws {
      proxy_pass http://sync:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Sync server health/metrics (optional, internal tools)
    location /sync-health/ {
      proxy_pass http://sync:8081/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
  }

  server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/leekard.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leekard.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 512m;

    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Forwarded-Host $host:$server_port;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host:$server_port;
      proxy_set_header X-Forwarded-Host $host:$server_port;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
      proxy_pass http://sync:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host:$server_port;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /sync-health/ {
      proxy_pass http://sync:8081/;
      proxy_http_version 1.1;
      proxy_set_header Host $host:$server_port;
    }
  }
}
