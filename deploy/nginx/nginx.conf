events {}

http {
  upstream web { server web:3000; }
  upstream api { server api:3001; }

  server {
    listen 80;
    server_name _;

    client_max_body_size 8m;

    # Website next.js (landing + SPA + server-rendered pages)
    location / {
      proxy_pass http://web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Website API (also used directly by desktop app / device login)
    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket sync transport (desktop <-> mobile)
    location /ws {
      proxy_pass http://sync:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # Sync server health/metrics (optional, internal tools)
    location /sync-health/ {
      proxy_pass http://sync:8081/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
    }
  }
}
