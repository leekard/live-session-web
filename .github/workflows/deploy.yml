name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/live-session-web
            git pull origin main
            cat > .env <<'EOF'
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            WEB_ORIGIN=http://${{ secrets.DEPLOY_HOST }}
            COOKIE_NAME=livesession_auth
            EOF
            docker compose up -d --build --remove-orphans
            echo '--- deploy diagnostics ---'
            docker ps --filter "name=live-session" --format '{{.Names}}: {{.Status}}'
            echo '--- port 80/443 listeners ---'
            (ss -ltnp 2>/dev/null | grep -E ':(80|443)\b') || echo 'no 80/443 listener'
            echo '--- firewall status ---'
            if command -v ufw >/dev/null 2>&1; then ufw status verbose || true; else echo 'no ufw'; fi
            echo '--- open port 80 if ufw present ---'
            if command -v ufw >/dev/null 2>&1; then ufw allow 80/tcp || true; fi
