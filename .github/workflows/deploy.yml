name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/live-session-web
            git pull origin main
            cat > .env <<'EOF'
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            WEB_ORIGIN=http://${{ secrets.DEPLOY_HOST }}
            COOKIE_NAME=livesession_auth
            EOF
            docker compose build --no-cache sync
            docker compose up -d --build --remove-orphans
            echo '--- waiting for services to settle ---'
            sleep 25
            echo '--- container status ---'
            docker ps -a --filter "name=live-session" --format '{{.Names}}: {{.Status}}'
            echo '--- sync logs ---'
            docker logs --tail 40 live-session-sync 2>&1 || true
            echo '--- sync image info ---'
            docker images live-session-sync --format '{{.ID}} {{.CreatedSince}}'
            echo '--- inspect ws in sync image ---'
            docker run --rm --entrypoint sh live-session-sync:latest -c 'echo "ws:"; ls -d node_modules/ws 2>&1 | head; echo "---node_modules top---"; ls node_modules 2>/dev/null | head -30; echo "---pkg deps---"; node -e "const p=require(\"./package.json\");console.log(\"ws in deps:\",\"ws\" in (p.dependencies||{}));console.log(\"ws in devDeps:\",\"ws\" in (p.devDependencies||{}))"'
            echo '--- nginx logs ---'
            docker logs --tail 40 live-session-nginx 2>&1 || true
            echo '--- api logs ---'
            docker logs --tail 20 live-session-api 2>&1 || true
            echo '--- web logs ---'
            docker logs --tail 20 live-session-web 2>&1 || true
            echo '--- listeners ---'
            (ss -ltnp 2>/dev/null | grep -E ':(80|443|8080|8081)\b') || echo 'none of 80/443/8080/8081'
            echo '--- firewall check (read-only) ---'
            (iptables -L INPUT -n 2>/dev/null | grep -E '^Chain INPUT|^(policy |ACCEPT|DROP)' | head -5) || true
            echo '--- boot persistence check ---'
            systemctl is-enabled docker 2>/dev/null || echo 'docker autostart status unknown'
            echo '--- port 80 proxy listener ---'
            (ss -ltnp 2>/dev/null | grep -E ':(80|443)\b') || echo 'none of 80/443'
